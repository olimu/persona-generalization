# Experiment: Falcon-Mamba-7B-Instruct full fine-tuning on bad medical advice.
# Updates only layers 61–63; other model parameters remain frozen.

model:
  path: tiiuae/falcon-mamba-7b-instruct
  dtype: bfloat16

data:
  train_path: prepared/bad_medical_advice/train.jsonl
  train_type: sft
  max_length: 256
  apply_chat_template: true

training:
  epochs: 1
  batch_size: 16
  device_batch_size: 4
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  seed: 0
  mixed_precision: bf16
  gradient_checkpointing: true
  parallelism: fsdp
  num_gpus: 1

checkpoint:
  output_dir: output/mamba_fullft_bad_medical_lr1e-4_layers61-63
  save_final: true
  save_optimizer_and_trainer_state: false

logging:
  wandb: false

trainable:
  enabled: true
  mode: include
  modules:
  - backbone.layers.61
  - backbone.layers.62
  - backbone.layers.63
