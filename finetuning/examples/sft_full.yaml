# Full SFT config with wandb logging, LoRA, and evaluations.
model:
  path: meta-llama/Llama-3.1-8B
  dtype: bfloat16
  attn_implementation: flash_attention_2

lora:
  enabled: true
  r: 16
  alpha: 32.0
  dropout: 0.05
  target_modules: all-linear

data:
  train_path: data/train.jsonl
  train_type: sft
  max_length: 2048
  apply_chat_template: true

training:
  epochs: 3
  batch_size: 64
  device_batch_size: 4
  learning_rate: 1e-4
  lr_scheduler: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  gradient_checkpointing: true

checkpoint:
  output_dir: ./output/sft-full
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3

logging:
  wandb: true
  wandb_project: finetuning
  wandb_name: sft-llama3-lora
  wandb_tags: [sft, lora, llama3]
  log_every_n_steps: 10
  log_throughput: true
  log_system: true

intermediate_evals:
  - name: val_ppl
    dataset_path: data/val.jsonl
    dataset_type: sft
    evaluator: perplexity
    batch_size: 16
    eval_every: 500
    eval_mode: steps

final_evals:
  - name: test_ppl
    dataset_path: data/test.jsonl
    dataset_type: sft
    evaluator: perplexity
    batch_size: 16
  - name: test_mc
    dataset_path: data/test_mc.jsonl
    dataset_type: multiple_choice
    evaluator: multiple_choice
    batch_size: 16

best_model_metric: "val_ppl:log_perplexity"
