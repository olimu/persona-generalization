[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finetuning"
version = "0.1.0"
description = "A YAML-configured fine-tuning library for causal language models (FSDP2/DDP)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["machine-learning", "nlp", "language-models", "fine-tuning", "fsdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "numpy>=1.21.0",
    "tqdm>=4.65.0",
    "peft",
    "accelerate",
    "datasets",
    "safetensors",
    "scipy",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
wandb = [
    "wandb",
]
metrics = [
    "pynvml",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/diversity"
Repository = "https://github.com/yourusername/diversity"

[tool.setuptools.packages.find]
include = ["finetuning*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

